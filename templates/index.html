<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>연세대 미래캠퍼스 졸업요건 체커</title>

  <style>
    :root{
      --bg:#f5f5f3;
      --surface:rgba(255,255,255,0.78);
      --surface-strong:#ffffff;
      --text:#171717;
      --muted:#6b6b6b;
      --line:#dfdfda;
      --line-strong:#c9c9c2;
      --accent:#7a8474;
      --accent-deep:#5d6658;
      --success:#4d6a53;
      --danger:#9a5b55;
      --shadow:0 20px 40px rgba(24,24,24,0.06);
      --radius-xl:28px;
      --radius-lg:20px;
      --radius-md:16px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      -webkit-text-size-adjust:100%;
    }

    body{
      min-height:100vh;
      font-family:'Pretendard','SUIT',sans-serif;
      background:
        radial-gradient(circle at top, rgba(122,132,116,0.12), transparent 34%),
        linear-gradient(180deg, #fbfbf9 0%, var(--bg) 100%);
      padding:20px 14px 40px;
      color:var(--text);
      line-height:1.5;
    }

    .container{
      width:100%;
      max-width:560px;
      margin:0 auto;
    }

    .card{
      background:var(--surface);
      border:1px solid rgba(255,255,255,0.75);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border-radius:var(--radius-xl);
      padding:24px 18px;
      margin-bottom:16px;
      box-shadow:var(--shadow);
    }

    h1{
      text-align:center;
      margin-bottom:10px;
      color:var(--text);
      font-size:clamp(1.8rem, 5vw, 2.2rem);
      font-weight:700;
      letter-spacing:-0.04em;
    }

    .subtitle{
      text-align:center;
      color:var(--muted);
      margin-bottom:28px;
      font-size:0.95rem;
    }

    label{
      display:block;
      margin-bottom:10px;
      font-weight:600;
      color:var(--text);
    }

    .course-section{
      margin-bottom:32px;
    }

    .section-title{
      font-size:0.98rem;
      font-weight:700;
      margin-bottom:14px;
      color:var(--text);
      letter-spacing:-0.02em;
    }

    .course-list{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }

    .course-item{
      background:rgba(255,255,255,0.62);
      border:1px solid var(--line);
      border-radius:var(--radius-md);
      padding:14px 15px;
      display:flex;
      align-items:flex-start;
      gap:12px;
      font-size:0.95rem;
      font-weight:500;
      color:var(--text);
      transition:border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .course-item:has(input:checked){
      border-color:var(--accent);
      background:rgba(122,132,116,0.12);
    }

    .course-item input{
      width:18px;
      height:18px;
      margin-top:2px;
      accent-color:var(--accent-deep);
      flex:0 0 auto;
    }

    .checkbox-group{
      display:grid;
      gap:12px;
      margin-bottom:24px;
    }

    .checkbox-group label{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:0;
      padding:14px 15px;
      border:1px solid var(--line);
      border-radius:var(--radius-md);
      background:rgba(255,255,255,0.62);
      font-weight:500;
    }

    .checkbox-group input{
      width:18px;
      height:18px;
      accent-color:var(--accent-deep);
      flex:0 0 auto;
    }

    .btn{
      width:100%;
      padding:16px;
      border:none;
      border-radius:999px;
      background:var(--text);
      color:#f8f8f6;
      font-size:0.98rem;
      font-weight:700;
      letter-spacing:-0.02em;
      cursor:pointer;
      transition:background 0.2s ease, transform 0.2s ease;
    }

    .btn:hover,
    .btn:focus-visible{
      background:var(--accent-deep);
      transform:translateY(-1px);
    }

    #result{
      display:none;
    }

    .result-item{
      padding:16px 0;
      border-bottom:1px solid var(--line);
      color:var(--muted);
    }

    .result-item b{
      color:var(--text);
      font-size:0.96rem;
    }

    .success{
      color:var(--success);
      font-weight:700;
    }

    .fail{
      color:var(--danger);
      font-weight:700;
    }

    .final-result{
      margin-top:22px;
      padding:18px;
      border-radius:var(--radius-lg);
      text-align:center;
      font-size:1.05rem;
      font-weight:700;
      letter-spacing:-0.02em;
    }

    .pass{
      background:rgba(77,106,83,0.12);
      color:var(--success);
    }

    .not-pass{
      background:rgba(154,91,85,0.12);
      color:var(--danger);
    }

    select{
      width:100%;
      padding:14px 16px;
      border:1px solid var(--line);
      border-radius:var(--radius-md);
      background:rgba(255,255,255,0.8);
      color:var(--text);
      font-size:0.96rem;
      margin-bottom:22px;
      outline:none;
      transition:border-color 0.2s ease, box-shadow 0.2s ease;
      appearance:none;
    }

    select:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 4px rgba(122,132,116,0.14);
    }

    .credit-box{
      background:linear-gradient(180deg, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0.66) 100%);
      border:1px solid var(--line);
      border-radius:var(--radius-lg);
      padding:22px 18px;
      text-align:center;
      margin-bottom:28px;
      font-weight:600;
      color:var(--muted);
    }

    #credit-display{
      font-size:2.2rem;
      color:var(--text);
      margin-top:6px;
      font-weight:700;
      letter-spacing:-0.05em;
    }

    @media (min-width:640px){
      body{
        padding:32px 20px 56px;
      }

      .card{
        padding:30px 26px;
      }

      .course-list{
        grid-template-columns:repeat(2, minmax(0, 1fr));
      }
    }

  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>🎓 연세대 미래캠퍼스 졸업요건 체커</h1>

    <div class="subtitle">
      전공을 선택하고 이수한 과목을 체크하세요
    </div>

    <label for="major">
      전공 선택
    </label>

    <select id="major">
      {% for major in majors %}
      <option value="{{ major }}">
        {{ major }}
      </option>
      {% endfor %}
    </select>

    <div class="credit-box">

      현재 선택 학점

      <div id="credit-display">
        0
      </div>

    </div>

    <div class="course-section">

      <div class="section-title">
        📘 전공필수 과목
      </div>

      <div id="major-course-list"
           class="course-list">
      </div>

    </div>

    <div class="course-section">

      <div class="section-title">
        📗 교양기초 과목
      </div>

      <div id="lib-course-list"
           class="course-list">
      </div>

    </div>

    <div class="course-section">

      <div class="section-title">
        📙 전공선택 과목
      </div>

      <div id="elective-course-list"
           class="course-list">
      </div>

    </div>

    <label>졸업인증</label>

    <div class="checkbox-group">

      <label>
        <input type="checkbox"
               id="foreign_lang_cert">

        외국어인증
      </label>

      <label>
        <input type="checkbox"
               id="info_cert">

        정보/산업실무역량인증
      </label>

    </div>

    <button class="btn"
            onclick="checkGraduation()">

      졸업요건 확인하기

    </button>

  </div>

  <div class="card" id="result">

    <h2 style="margin-bottom:20px;">
      📊 결과
    </h2>

    <div id="result-content"></div>

  </div>

</div>

<script>
document
.getElementById("major")
.addEventListener("change", loadCourses);

window.onload = loadCourses;


async function loadCourses(){

  const major =
  document.getElementById("major").value;

  const res =
  await fetch(`/courses/${major}`);

  const courses =
  await res.json();

  const majorList =
  document.getElementById("major-course-list");

  const libList =
  document.getElementById("lib-course-list");

  const electiveList =
  document.getElementById("elective-course-list");

  majorList.innerHTML = "";
  libList.innerHTML = "";
  electiveList.innerHTML = "";

  // 전공필수
  courses.major_required.forEach(course => {

    majorList.innerHTML += `
      <label class="course-item">

        <input
          type="checkbox"
          value="${course.name}"
          data-credit="${course.credit}"
          onchange="updateCredits()">

        ${course.name}
        (${course.credit}학점)

      </label>
    `;

  });

  // 교양기초
  courses.liberal_required.forEach(course => {

    libList.innerHTML += `
      <label class="course-item">

        <input
          type="checkbox"
          value="${course.name}"
          data-credit="${course.credit}"
          onchange="updateCredits()">

        ${course.name}
        (${course.credit}학점)

      </label>
    `;

  });

  // 전공선택
  (courses.major_electives || []).forEach(course => {

    electiveList.innerHTML += `
      <label class="course-item">

        <input
          type="checkbox"
          value="${course.name}"
          data-credit="${course.credit}"
          onchange="updateCredits()">

        ${course.name}
        (${course.credit}학점)

      </label>
    `;

  });

  updateCredits();

}


function updateCredits(){

  let total = 0;

  const checked =
  document.querySelectorAll(
    '.course-list input:checked'
  );

  checked.forEach(course => {

    total += parseFloat(
      course.dataset.credit
    );

  });

  document.getElementById(
    "credit-display"
  ).innerText = total;

}


async function checkGraduation(){

  const major =
  document.getElementById("major").value;

  const total_credits =
  parseFloat(
    document.getElementById(
      "credit-display"
    ).innerText
  );

  const foreign_lang_cert =
  document.getElementById(
    "foreign_lang_cert"
  ).checked;

  const info_cert =
  document.getElementById(
    "info_cert"
  ).checked;

  const checked =
  document.querySelectorAll(
    '.course-list input:checked'
  );

  const courses =
  Array.from(checked)
  .map(c => c.value);

  try {

    const res = await fetch(
      "/check",
      {
        method: "POST",

        headers: {
          "Content-Type":
          "application/json"
        },

        body: JSON.stringify({

          major: major,

          total_credits:
          total_credits,

          courses: courses,

          foreign_lang_cert:
          foreign_lang_cert,

          info_cert:
          info_cert

        })
      }
    );

    const data =
    await res.json();

    console.log(data);

    renderResult(data);

  }
  catch(error){

    console.log(error);

    alert("오류 발생");

  }

}
function renderResult(data){

  document
  .getElementById("result")
  .style.display = "block";

  let html = "";

  html += `
    <div class="result-item">

      <b>총 이수학점</b><br>

      ${data["총이수학점"]["현재"]}
      /
      ${data["총이수학점"]["필요"]}

      학점

    </div>
  `;

  html += `
    <div class="result-item">

      <b>전공필수</b><br>

      ${
        data["전공필수"]["충족"]
        ?
        '<span class="success">충족</span>'
        :
        '<span class="fail">미충족</span>'
      }

      <br><br>

      미이수:

      ${
        data["전공필수"]["미이수"].length > 0
        ?
        data["전공필수"]["미이수"].join(", ")
        :
        "없음"
      }

    </div>
  `;

  html += `
    <div class="result-item">

      <b>교양기초</b><br>

      ${
        data["교양기초"]["충족"]
        ?
        '<span class="success">충족</span>'
        :
        '<span class="fail">미충족</span>'
      }

      <br><br>

      미이수:

      ${
        data["교양기초"]["미이수"].length > 0
        ?
        data["교양기초"]["미이수"].join(", ")
        :
        "없음"
      }

    </div>
  `;

  html += `
    <div class="result-item">

      <b>졸업인증</b><br>

      ${
        data["졸업인증"]["충족"]
        ?
        '<span class="success">충족</span>'
        :
        '<span class="fail">미충족</span>'
      }

    </div>
  `;

  html += `
    <div class="result-item">

      <b>전체 달성률</b><br>

      ${data["전체달성률"]}%

    </div>
  `;

  html += `
    <div class="final-result
      ${
        data["졸업가능"]
        ?
        "pass"
        :
        "not-pass"
      }">

      ${
        data["졸업가능"]
        ?
        "🎉 졸업 가능합니다!"
        :
        "⚠️ 아직 부족한 요건이 있습니다."
      }

    </div>
  `;

  document
  .getElementById(
    "result-content"
  )
  .innerHTML = html;

}

</script>

</body>
</html>
