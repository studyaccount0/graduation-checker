<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>연세대 미래캠퍼스 졸업요건 체커</title>

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:'Pretendard',sans-serif;
      background:#f3f6ff;
      padding:40px 20px;
      color:#222;
    }

    .container{
      max-width:900px;
      margin:auto;
    }

    .card{
      background:white;
      border-radius:16px;
      padding:30px;
      margin-bottom:24px;
      box-shadow:0 4px 20px rgba(0,0,0,0.08);
    }

    h1{
      text-align:center;
      margin-bottom:10px;
      color:#003366;
    }

    .subtitle{
      text-align:center;
      color:#666;
      margin-bottom:30px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
    }

    .course-section{
      margin-bottom:28px;
    }

    .section-title{
      font-size:18px;
      font-weight:bold;
      margin-bottom:12px;
      color:#003366;
    }

    .course-list{
      display:grid;
      grid-template-columns:
      repeat(auto-fill,minmax(220px,1fr));
      gap:10px;
    }

    .course-item{
      background:#f7f9ff;
      border:1px solid #dde3f0;
      border-radius:10px;
      padding:10px;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .course-item input{
      width:18px;
      height:18px;
    }

    .checkbox-group{
      display:flex;
      gap:20px;
      margin-bottom:20px;
      flex-wrap:wrap;
    }

    .btn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:12px;
      background:#003366;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .btn:hover{
      background:#002244;
    }

    #result{
      display:none;
    }

    .result-item{
      padding:14px 0;
      border-bottom:1px solid #eee;
    }

    .success{
      color:green;
      font-weight:bold;
    }

    .fail{
      color:red;
      font-weight:bold;
    }

    .final-result{
      margin-top:20px;
      padding:20px;
      border-radius:12px;
      text-align:center;
      font-size:20px;
      font-weight:bold;
    }

    .pass{
      background:#e6f4ea;
      color:#1a7a3a;
    }

    .not-pass{
      background:#fdecea;
      color:#c0392b;
    }

    select{
      width:100%;
      padding:12px 14px;
      border:1.5px solid #dde3f0;
      border-radius:10px;
      background:#fafbff;
      font-size:15px;
      margin-bottom:20px;
      outline:none;
      transition:border-color 0.2s;
    }

    select:focus{
      border-color:#003366;
    }

.credit-box{
  background:#f7f9ff;
  border:1px solid #dde3f0;
  border-radius:12px;
  padding:18px;
  text-align:center;
  margin-bottom:24px;
  font-weight:bold;
}

#credit-display{
  font-size:28px;
  color:#003366;
  margin-top:8px;
}

  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>🎓 연세대 미래캠퍼스 졸업요건 체커</h1>

    <div class="subtitle">
      전공을 선택하고 이수한 과목을 체크하세요
    </div>

    <label for="major">
      전공 선택
    </label>

    <select id="major">
      {% for major in majors %}
      <option value="{{ major }}">
        {{ major }}
      </option>
      {% endfor %}
    </select>

    <div class="credit-box">

      현재 선택 학점

      <div id="credit-display">
        0
      </div>

    </div>

    <div class="course-section">

      <div class="section-title">
        📘 전공필수 과목
      </div>

      <div id="major-course-list"
           class="course-list">
      </div>

    </div>

    <div class="course-section">

      <div class="section-title">
        📗 교양기초 과목
      </div>

      <div id="lib-course-list"
           class="course-list">
      </div>

    </div>

    <div class="course-section">

      <div class="section-title">
        📙 전공선택 과목
      </div>

      <div id="elective-course-list"
           class="course-list">
      </div>

    </div>

    <label>졸업인증</label>

    <div class="checkbox-group">

      <label>
        <input type="checkbox"
               id="foreign_lang_cert">

        외국어인증
      </label>

      <label>
        <input type="checkbox"
               id="info_cert">

        정보/산업실무역량인증
      </label>

    </div>

    <button class="btn"
            onclick="checkGraduation()">

      졸업요건 확인하기

    </button>

  </div>

  <div class="card" id="result">

    <h2 style="margin-bottom:20px;">
      📊 결과
    </h2>

    <div id="result-content"></div>

  </div>

</div>

<script>
document
.getElementById("major")
.addEventListener("change", loadCourses);

window.onload = loadCourses;


async function loadCourses(){

  const major =
  document.getElementById("major").value;

  const res =
  await fetch(`/courses/${major}`);

  const courses =
  await res.json();

  const majorList =
  document.getElementById("major-course-list");

  const libList =
  document.getElementById("lib-course-list");

  const electiveList =
  document.getElementById("elective-course-list");

  majorList.innerHTML = "";
  libList.innerHTML = "";
  electiveList.innerHTML = "";

  // 전공필수
  courses.major_required.forEach(course => {

    majorList.innerHTML += `
      <label class="course-item">

        <input
          type="checkbox"
          value="${course.name}"
          data-credit="${course.credit}"
          onchange="updateCredits()">

        ${course.name}
        (${course.credit}학점)

      </label>
    `;

  });

  // 교양기초
  courses.liberal_required.forEach(course => {

    libList.innerHTML += `
      <label class="course-item">

        <input
          type="checkbox"
          value="${course.name}"
          data-credit="${course.credit}"
          onchange="updateCredits()">

        ${course.name}
        (${course.credit}학점)

      </label>
    `;

  });

  // 전공선택
  (courses.major_electives || []).forEach(course => {

    electiveList.innerHTML += `
      <label class="course-item">

        <input
          type="checkbox"
          value="${course.name}"
          data-credit="${course.credit}"
          onchange="updateCredits()">

        ${course.name}
        (${course.credit}학점)

      </label>
    `;

  });

  updateCredits();

}


function updateCredits(){

  let total = 0;

  const checked =
  document.querySelectorAll(
    '.course-list input:checked'
  );

  checked.forEach(course => {

    total += parseFloat(
      course.dataset.credit
    );

  });

  document.getElementById(
    "credit-display"
  ).innerText = total;

}


async function checkGraduation(){

  const major =
  document.getElementById("major").value;

  const total_credits =
  parseFloat(
    document.getElementById(
      "credit-display"
    ).innerText
  );

  const foreign_lang_cert =
  document.getElementById(
    "foreign_lang_cert"
  ).checked;

  const info_cert =
  document.getElementById(
    "info_cert"
  ).checked;

  const checked =
  document.querySelectorAll(
    '.course-list input:checked'
  );

  const courses =
  Array.from(checked)
  .map(c => c.value);

  try {

    const res = await fetch(
      "/check",
      {
        method: "POST",

        headers: {
          "Content-Type":
          "application/json"
        },

        body: JSON.stringify({

          major: major,

          total_credits:
          total_credits,

          courses: courses,

          foreign_lang_cert:
          foreign_lang_cert,

          info_cert:
          info_cert

        })
      }
    );

    const data =
    await res.json();

    console.log(data);

    renderResult(data);

  }
  catch(error){

    console.log(error);

    alert("오류 발생");

  }

}
function renderResult(data){

  document
  .getElementById("result")
  .style.display = "block";

  let html = "";

  html += `
    <div class="result-item">

      <b>총 이수학점</b><br>

      ${data["총이수학점"]["현재"]}
      /
      ${data["총이수학점"]["필요"]}

      학점

    </div>
  `;

  html += `
    <div class="result-item">

      <b>전공필수</b><br>

      ${
        data["전공필수"]["충족"]
        ?
        '<span class="success">충족</span>'
        :
        '<span class="fail">미충족</span>'
      }

      <br><br>

      미이수:

      ${
        data["전공필수"]["미이수"].length > 0
        ?
        data["전공필수"]["미이수"].join(", ")
        :
        "없음"
      }

    </div>
  `;

  html += `
    <div class="result-item">

      <b>교양기초</b><br>

      ${
        data["교양기초"]["충족"]
        ?
        '<span class="success">충족</span>'
        :
        '<span class="fail">미충족</span>'
      }

      <br><br>

      미이수:

      ${
        data["교양기초"]["미이수"].length > 0
        ?
        data["교양기초"]["미이수"].join(", ")
        :
        "없음"
      }

    </div>
  `;

  html += `
    <div class="result-item">

      <b>졸업인증</b><br>

      ${
        data["졸업인증"]["충족"]
        ?
        '<span class="success">충족</span>'
        :
        '<span class="fail">미충족</span>'
      }

    </div>
  `;

  html += `
    <div class="result-item">

      <b>전체 달성률</b><br>

      ${data["전체달성률"]}%

    </div>
  `;

  html += `
    <div class="final-result
      ${
        data["졸업가능"]
        ?
        "pass"
        :
        "not-pass"
      }">

      ${
        data["졸업가능"]
        ?
        "🎉 졸업 가능합니다!"
        :
        "⚠️ 아직 부족한 요건이 있습니다."
      }

    </div>
  `;

  document
  .getElementById(
    "result-content"
  )
  .innerHTML = html;

}

</script>

</body>
</html>
