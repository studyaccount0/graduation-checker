<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>연세대 미래캠퍼스 졸업요건 체커</title>
  <style>
    :root {
      --bg: #f5f5f3;
      --surface: rgba(255,255,255,0.78);
      --surface-strong: #ffffff;
      --text: #171717;
      --muted: #6b6b6b;
      --line: #dfdfda;
      --line-strong: #c9c9c2;
      --accent: #7a8474;
      --accent-deep: #5d6658;
      --success: #4d6a53;
      --danger: #9a5b55;
      --shadow: 0 20px 40px rgba(24,24,24,0.06);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      font-family: 'Pretendard', 'SUIT', sans-serif;
      background:
        radial-gradient(circle at top, rgba(122,132,116,0.12), transparent 34%),
        linear-gradient(180deg, #fbfbf9 0%, var(--bg) 100%);
      padding: 20px 14px 40px;
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 1480px;
      margin: 0 auto;
    }

    .app-shell {
      display: grid;
      gap: 16px;
      align-items: start;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.75);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: var(--radius-xl);
      padding: 24px 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .results-stack {
      display: grid;
      gap: 16px;
    }

    #result,
    #recommend-result,
    #route-result {
      scroll-margin-top: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: var(--text);
      font-size: clamp(1.6rem, 5vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 28px;
      font-size: 0.95rem;
    }

    label { display: block; margin-bottom: 10px; font-weight: 600; color: var(--text); }

    .course-section { margin-bottom: 32px; }

    .courses-grid {
      display: grid;
      gap: 16px;
    }

    .section-title {
      font-size: 0.98rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .course-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }

    .course-item {
      background: rgba(255,255,255,0.62);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.93rem;
      font-weight: 500;
      color: var(--text);
      transition: border-color 0.2s, background 0.2s;
    }

    .course-item:has(input:checked) {
      border-color: var(--accent);
      background: rgba(122,132,116,0.12);
    }

    .course-item.track-required {
      border-color: #c9a84c;
      background: rgba(201,168,76,0.08);
    }

    .course-item.track-required:has(input:checked) {
      background: rgba(201,168,76,0.2);
    }

    .course-item input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-deep);
      flex: 0 0 auto;
    }

    .checkbox-group {
      display: grid;
      gap: 10px;
      margin-bottom: 20px;
    }

    .action-grid {
      display: grid;
      gap: 12px;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 0;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.62);
      font-weight: 500;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-deep);
      flex: 0 0 auto;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 999px;
      background: var(--text);
      color: #f8f8f6;
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .btn:hover { background: var(--accent-deep); transform: translateY(-1px); }

    .btn-green {
      background: #2d5a3d;
    }

    .btn-green:hover { background: #1e3d2a; }

    .btn-purple {
      background: #5a3080;
    }

    .btn-purple:hover { background: #3d2060; }

    #result { display: none; }

    .result-item {
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
    }

    .result-item b { color: var(--text); font-size: 0.96rem; }

    .success { color: var(--success); font-weight: 700; }
    .fail { color: var(--danger); font-weight: 700; }

    .final-result {
      margin-top: 22px;
      padding: 18px;
      border-radius: var(--radius-lg);
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .pass { background: rgba(77,106,83,0.12); color: var(--success); }
    .not-pass { background: rgba(154,91,85,0.12); color: var(--danger); }

    .result-grid {
      display: grid;
      gap: 18px;
    }

    .result-meta {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      margin-bottom: 4px;
    }

    .meta-box {
      background: rgba(255,255,255,0.62);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 14px 16px;
    }

    .meta-box .meta-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .meta-box .meta-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.03em;
    }

    select {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.8);
      color: var(--text);
      font-size: 0.96rem;
      margin-bottom: 20px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      appearance: none;
    }

    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(122,132,116,0.14);
    }

    .credit-box {
      background: linear-gradient(180deg, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0.66) 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 22px 18px;
      text-align: center;
      margin-bottom: 28px;
      font-weight: 600;
      color: var(--muted);
    }

    #credit-display {
      font-size: 2.2rem;
      color: var(--text);
      margin-top: 6px;
      font-weight: 700;
      letter-spacing: -0.05em;
    }

    /* 트랙 섹션 */
    #track-section {
      display: none;
      margin-bottom: 28px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      padding: 20px;
      background: rgba(122,132,116,0.06);
    }

    .track-desc { font-size: 13px; color: var(--muted); margin-bottom: 14px; font-weight: normal; }
    .track-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }

    .track-tab {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--accent);
      background: white;
      color: var(--accent-deep);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .track-tab:hover { background: rgba(122,132,116,0.1); }
    .track-tab.active { background: var(--accent-deep); color: white; border-color: var(--accent-deep); }
    .track-tab.none-tab { border-color: var(--line-strong); color: var(--muted); }
    .track-tab.none-tab.active { background: var(--muted); color: white; border-color: var(--muted); }

    .track-courses-wrap { display: none; }
    .track-courses-wrap.visible { display: block; }

    /* 프로그레스 바 */
    .progress-bar-wrap {
      background: rgba(122,132,116,0.15);
      border-radius: 8px;
      height: 8px;
      margin-top: 8px;
      overflow: hidden;
    }

    .progress-bar {
      height: 8px;
      background: var(--accent-deep);
      border-radius: 8px;
      transition: width 0.4s;
    }

    /* 태그 */
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

    .tag {
      background: rgba(122,132,116,0.12);
      color: var(--accent-deep);
      border-radius: 8px;
      padding: 3px 10px;
      font-size: 13px;
    }

    .tag.done { background: rgba(77,106,83,0.12); color: var(--success); }
    .tag.missing { background: rgba(154,91,85,0.12); color: var(--danger); }

    /* 트랙 추천 카드 */
    .rec-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 14px;
      background: rgba(255,255,255,0.6);
    }

    .rec-card.rank-1 { border-color: #c9a84c; background: rgba(201,168,76,0.07); }
    .rec-card.rank-2 { border-color: #7aabcf; background: rgba(122,171,207,0.07); }
    .rec-card.rank-3 { border-color: #7aaa84; background: rgba(122,170,132,0.07); }

    .rec-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .rec-title { font-size: 16px; font-weight: 700; color: var(--text); }
    .rec-pct { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.03em; }
    .rec-desc { font-size: 13px; color: var(--muted); margin-bottom: 12px; }

    .rank-badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      border-radius: 999px;
      padding: 3px 12px;
      margin-right: 8px;
    }

    .rank-1 .rank-badge { background: #c9a84c; color: white; }
    .rank-2 .rank-badge { background: #7aabcf; color: white; }
    .rank-3 .rank-badge { background: #7aaa84; color: white; }

    .rec-stat { font-size: 13px; color: var(--muted); margin-bottom: 10px; }

    /* 최단 루트 */
    .route-summary { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }

    .route-stat-box {
      flex: 1;
      min-width: 110px;
      background: rgba(122,132,116,0.08);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      padding: 14px;
      text-align: center;
    }

    .route-stat-box .num { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: -0.04em; }
    .route-stat-box .label { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .route-group { margin-bottom: 20px; }

    .route-group-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      padding: 5px 12px;
      border-radius: 8px;
      display: inline-block;
    }

    .route-group-title.type-전공필수    { background: rgba(59,130,246,0.12); color: #1e40af; }
    .route-group-title.type-교양기초필수 { background: rgba(34,197,94,0.12); color: #166534; }
    .route-group-title.type-트랙필수    { background: rgba(201,168,76,0.15); color: #854d0e; }
    .route-group-title.type-트랙선택    { background: rgba(168,85,247,0.12); color: #6b21a8; }

    .route-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 11px 14px;
      margin-bottom: 8px;
    }

    .route-item .name { font-weight: 600; font-size: 14px; color: var(--text); }
    .route-item .credit { font-size: 13px; color: var(--accent-deep); font-weight: 700; white-space: nowrap; }
    .route-item .note { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .all-done-msg {
      text-align: center;
      padding: 30px;
      color: var(--success);
      font-size: 18px;
      font-weight: 700;
    }

    @media (min-width: 640px) {
      body { padding: 32px 20px 56px; }
      .card { padding: 30px 26px; }
      .courses-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .action-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (min-width: 1100px) {
      body { padding: 24px 24px 40px; }
      .app-shell { grid-template-columns: minmax(560px, 0.95fr) minmax(480px, 0.85fr); }
      .controls-card {
        margin-bottom: 0;
      }
      .card { padding: 22px 20px; }
      .subtitle { margin-bottom: 20px; }
      .credit-box { padding: 16px 14px; margin-bottom: 20px; }
      #credit-display { font-size: 2rem; }
      .course-section { margin-bottom: 0; }
      .courses-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .course-list { grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 8px; }
      .course-item {
        padding: 9px 11px;
        font-size: 0.86rem;
        gap: 8px;
        align-items: flex-start;
      }
      .course-item input { width: 16px; height: 16px; margin-top: 1px; }
      .checkbox-group { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .checkbox-group label { padding: 11px 12px; font-size: 0.92rem; }
      .btn { padding: 13px 14px; font-size: 0.94rem; }
      .result-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .result-item.track-item,
      .result-item.cert-item,
      .result-item.overall-item,
      .final-result {
        grid-column: 1 / -1;
      }
      .route-summary { gap: 10px; margin-bottom: 16px; }
      .route-stat-box { padding: 12px; }
      .route-item { padding: 9px 12px; }
      .rec-card { padding: 16px; }
    }
  </style>
</head>

<body>
<div class="container">
  <div class="app-shell">
  <div class="card controls-card">
    <h1>🎓 연세대 미래캠퍼스 졸업요건 체커</h1>
    <div class="subtitle">전공을 선택하고 이수한 과목을 체크하세요</div>

    <label for="major">전공 선택</label>
    <select id="major">
      {% for major in majors %}
      <option value="{{ major }}">{{ major }}</option>
      {% endfor %}
    </select>

    <div id="track-section">
      <div class="section-title">🛤️ 트랙 선택</div>
      <div class="track-desc">트랙을 선택하면 해당 트랙의 이수 요건도 함께 검사합니다.</div>
      <div class="track-tabs" id="track-tabs"></div>
      <div id="track-courses-area"></div>
    </div>

    <div class="credit-box">
      현재 선택 학점
      <div id="credit-display">0</div>
    </div>

    <div class="courses-grid">
      <div class="course-section">
        <div class="section-title">📘 전공필수 과목</div>
        <div id="major-course-list" class="course-list"></div>
      </div>

      <div class="course-section">
        <div class="section-title">📗 교양기초 과목</div>
        <div id="lib-course-list" class="course-list"></div>
      </div>

      <div class="course-section">
        <div class="section-title">📙 전공선택 과목</div>
        <div id="elective-course-list" class="course-list"></div>
      </div>
    </div>

    <label>졸업인증</label>
    <div class="checkbox-group">
      <label><input type="checkbox" id="foreign_lang_cert"> 외국어인증</label>
      <label><input type="checkbox" id="info_cert"> 정보/산업실무역량인증</label>
    </div>

    <div class="action-grid">
      <button class="btn" onclick="checkGraduation()">졸업요건 확인하기</button>

      <div id="recommend-btn-wrap" style="display:none;">
        <button class="btn btn-green" onclick="recommendTrack()">
          🔍 내 이수 과목으로 트랙 추천받기
        </button>
      </div>

      <div>
        <button class="btn btn-purple" onclick="showMinRoute()">
          🗺️ 졸업 최단 루트 보기
        </button>
      </div>
    </div>
  </div>

  <div class="results-stack">
    <div class="card" id="result">
      <h2 style="margin-bottom:20px; font-weight:700; letter-spacing:-0.03em;">📊 결과</h2>
      <div id="result-content"></div>
    </div>

    <div class="card" id="recommend-result" style="display:none;">
      <h2 style="margin-bottom:6px; font-weight:700; letter-spacing:-0.03em;">🎯 트랙 추천 결과</h2>
      <div style="color:var(--muted); font-size:13px; margin-bottom:20px;">이수 과목 기준 달성률이 높은 순으로 정렬됩니다.</div>
      <div id="recommend-content"></div>
    </div>

    <div class="card" id="route-result" style="display:none;">
      <h2 style="margin-bottom:6px; font-weight:700; letter-spacing:-0.03em;">🗺️ 졸업 최단 루트</h2>
      <div style="color:var(--muted); font-size:13px; margin-bottom:20px;">
        현재 이수 과목 기준, 졸업을 위해 반드시 들어야 할 최소 과목 목록입니다.
      </div>
      <div id="route-content"></div>
    </div>
  </div>
</div>
</div>

<script>
let allTracks = {};
let selectedTrack = null;

document.getElementById("major").addEventListener("change", loadCourses);
window.onload = loadCourses;

function revealSection(el) {
  requestAnimationFrame(() => {
    el.scrollIntoView({ behavior: "smooth", block: "start" });
  });
}

async function loadCourses() {
  const major = document.getElementById("major").value;
  const res = await fetch(`/courses/${major}`);
  const courses = await res.json();

  document.getElementById("major-course-list").innerHTML = "";
  document.getElementById("lib-course-list").innerHTML = "";
  document.getElementById("elective-course-list").innerHTML = "";

  courses.major_required.forEach(course => {
    document.getElementById("major-course-list").innerHTML += courseItemHTML(course);
  });
  courses.liberal_required.forEach(course => {
    document.getElementById("lib-course-list").innerHTML += courseItemHTML(course);
  });
  (courses.major_electives || []).forEach(course => {
    document.getElementById("elective-course-list").innerHTML += courseItemHTML(course);
  });

  allTracks = courses.tracks || {};
  selectedTrack = null;
  renderTrackSection(allTracks);
  updateCredits();
}

function courseItemHTML(course, extraClass = "") {
  return `
    <label class="course-item ${extraClass}">
      <input type="checkbox" value="${course.name}" data-credit="${course.credit}" onchange="updateCredits()">
      ${course.name} (${course.credit}학점)
    </label>
  `;
}

function renderTrackSection(tracks) {
  const section = document.getElementById("track-section");
  const tabsEl = document.getElementById("track-tabs");
  const areaEl = document.getElementById("track-courses-area");
  const recBtn = document.getElementById("recommend-btn-wrap");

  if (Object.keys(tracks).length === 0) {
    section.style.display = "none";
    recBtn.style.display = "none";
    return;
  }

  section.style.display = "block";
  recBtn.style.display = "block";

  let tabHTML = `<button class="track-tab none-tab active" onclick="selectTrack(null, this)">선택 안 함</button>`;
  Object.keys(tracks).forEach(name => {
    tabHTML += `<button class="track-tab" onclick="selectTrack('${name}', this)">${name}</button>`;
  });
  tabsEl.innerHTML = tabHTML;

  areaEl.innerHTML = "";
  Object.entries(tracks).forEach(([name, data]) => {
    areaEl.innerHTML += `
      <div id="track-wrap-${name}" class="track-courses-wrap">
        <div style="margin-bottom:10px; font-size:13px; color:var(--muted);">${data.설명}</div>
        <div style="margin-bottom:8px; font-weight:700; color:var(--text); font-size:13px;">🔒 트랙 필수 (${data.필수학점}학점 이수 필요)</div>
        <div class="course-list" style="margin-bottom:14px;">
          ${data.트랙필수.map(c => courseItemHTML(c, "track-required")).join("")}
        </div>
        <div style="margin-bottom:8px; font-weight:700; color:var(--text); font-size:13px;">📂 트랙 선택</div>
        <div class="course-list">
          ${data.트랙선택.map(c => courseItemHTML(c)).join("")}
        </div>
        <div style="margin-top:10px; font-size:12px; color:var(--muted);">
          * 트랙 이수: 트랙 필수 ${data.필수학점}학점 포함 총 ${data.최소이수학점}학점 이상 이수
        </div>
      </div>
    `;
  });
}

function selectTrack(trackName, btn) {
  document.querySelectorAll(".track-tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  document.querySelectorAll(".track-courses-wrap").forEach(el => el.classList.remove("visible"));
  selectedTrack = trackName;
  if (trackName) {
    const wrap = document.getElementById(`track-wrap-${trackName}`);
    if (wrap) wrap.classList.add("visible");
  }
  updateCredits();
}

function updateCredits() {
  let total = 0;
  document.querySelectorAll('input[type="checkbox"][data-credit]:checked').forEach(c => {
    total += parseFloat(c.dataset.credit);
  });
  document.getElementById("credit-display").innerText = total;
}

async function showMinRoute() {
  const major = document.getElementById("major").value;
  let total_credits = 0;
  document.querySelectorAll('input[type="checkbox"][data-credit]:checked').forEach(c => {
    total_credits += parseFloat(c.dataset.credit);
  });
  const checked = document.querySelectorAll('input[type="checkbox"][data-credit]:checked');
  const courses = Array.from(checked).map(c => c.value);
  try {
    const res = await fetch("/min-route", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ major, courses, selected_track: selectedTrack, total_credits })
    });
    const data = await res.json();
    renderRoute(data);
  } catch (e) {
    console.error(e);
    alert("오류 발생");
  }
}

function renderRoute(data) {
  const el = document.getElementById("route-result");
  const content = document.getElementById("route-content");
  el.style.display = "block";

  if (data.error) {
    content.innerHTML = `<div style="color:var(--danger);">${data.error}</div>`;
    revealSection(el);
    return;
  }

  if (data.총과목수 === 0) {
    content.innerHTML = `
      <div class="all-done-msg">
        🎉 필수 이수 과목을 모두 완료했습니다!<br>
        <span style="font-size:14px; color:var(--muted); font-weight:normal;">졸업요건 확인하기로 최종 확인해 보세요.</span>
      </div>`;
    revealSection(el);
    return;
  }

  let html = `
    <div class="route-summary">
      <div class="route-stat-box">
        <div class="num">${data.총과목수}</div>
        <div class="label">남은 필수 과목</div>
      </div>
      <div class="route-stat-box">
        <div class="num">${data.총학점}</div>
        <div class="label">남은 총 학점</div>
      </div>
      ${data.선택트랙 ? `
      <div class="route-stat-box">
        <div class="num" style="font-size:16px;">${data.선택트랙}</div>
        <div class="label">선택 트랙</div>
      </div>` : ""}
    </div>
  `;

  const grouped = data.grouped;
  const groupOrder = ["전공필수", "교양기초필수", ...Object.keys(grouped).filter(k => k.startsWith("트랙"))];

  groupOrder.forEach(group => {
    if (!grouped[group]) return;
    const items = grouped[group];
    let cls = "type-전공필수";
    if (group === "교양기초필수") cls = "type-교양기초필수";
    else if (group.startsWith("트랙필수")) cls = "type-트랙필수";
    else if (group.startsWith("트랙선택")) cls = "type-트랙선택";

    const groupCredits = items.reduce((s, r) => s + r["학점"], 0);
    html += `
      <div class="route-group">
        <div class="route-group-title ${cls}">
          ${group} &nbsp;<span style="font-weight:normal; font-size:12px;">(${items.length}과목 · ${groupCredits}학점)</span>
        </div>
        ${items.map(r => `
          <div class="route-item">
            <div>
              <div class="name">${r["과목명"]}</div>
              ${r["비고"] ? `<div class="note">※ ${r["비고"]}</div>` : ""}
            </div>
            <div class="credit">${r["학점"]}학점</div>
          </div>
        `).join("")}
      </div>
    `;
  });

  content.innerHTML = html;
  revealSection(el);
}

async function recommendTrack() {
  const major = document.getElementById("major").value;
  const checked = document.querySelectorAll('input[type="checkbox"][data-credit]:checked');
  const courses = Array.from(checked).map(c => c.value);
  try {
    const res = await fetch("/recommend", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ major, courses })
    });
    const data = await res.json();
    renderRecommend(data);
  } catch (e) {
    console.error(e);
    alert("오류 발생");
  }
}

function renderRecommend(data) {
  const el = document.getElementById("recommend-result");
  const content = document.getElementById("recommend-content");
  el.style.display = "block";

  if (data.message) {
    content.innerHTML = `<div style="color:var(--muted);">${data.message}</div>`;
    revealSection(el);
    return;
  }

  const rankLabel = ["🥇 1위", "🥈 2위", "🥉 3위"];
  const rankClass = ["rank-1", "rank-2", "rank-3"];
  let html = "";

  data.tracks.forEach((t, i) => {
    const rank = i < 3 ? rankClass[i] : "";
    const label = i < 3 ? rankLabel[i] : `${i+1}위`;
    const pct = t["달성률"];
    const barColor = t["이수완료"] ? "#4d6a53" : (pct >= 60 ? "#5d6658" : "#c9c9c2");

    html += `
      <div class="rec-card ${rank}">
        <div class="rec-header">
          <div class="rec-title">
            <span class="rank-badge">${label}</span>${t["트랙명"]}
            ${t["이수완료"] ? '<span class="tag done" style="font-size:12px; padding:2px 8px;">✓ 이수 가능</span>' : ""}
          </div>
          <div class="rec-pct">${pct}%</div>
        </div>
        <div class="rec-desc">${t["설명"]}</div>
        <div class="progress-bar-wrap" style="margin-bottom:10px;">
          <div class="progress-bar" style="width:${pct}%; background:${barColor};"></div>
        </div>
        <div class="rec-stat">
          이수 학점: <b>${t["이수학점"]}</b> / ${t["필요학점"]}학점
          &nbsp;|&nbsp; 잔여: <b>${t["잔여학점"]}학점</b>
        </div>
        <div style="margin-bottom:6px; font-size:13px; font-weight:700;">🔒 트랙 필수</div>
        <div class="tag-list" style="margin-bottom:10px;">
          ${t["트랙필수_완료"].map(c => `<span class="tag done">✓ ${c}</span>`).join("")}
          ${t["트랙필수_미이수"].map(c => `<span class="tag missing">✗ ${c}</span>`).join("")}
          ${t["트랙필수_완료"].length === 0 && t["트랙필수_미이수"].length === 0
            ? '<span style="color:var(--muted); font-size:13px;">없음</span>' : ""}
        </div>
        ${t["트랙선택_미이수"].length > 0 ? `
        <div style="margin-bottom:6px; font-size:13px; font-weight:700;">📂 추가 이수 가능한 트랙 선택 과목</div>
        <div class="tag-list">
          ${t["트랙선택_완료"].map(c => `<span class="tag done">✓ ${c}</span>`).join("")}
          ${t["트랙선택_미이수"].map(c => `<span class="tag" style="background:rgba(0,0,0,0.05); color:var(--muted);">○ ${c}</span>`).join("")}
        </div>` : `
        <div style="font-size:13px; color:var(--success); font-weight:700;">✅ 트랙 선택 과목 모두 이수 완료</div>`}
      </div>
    `;
  });

  content.innerHTML = html;
  revealSection(el);
}

async function checkGraduation() {
  const major = document.getElementById("major").value;
  const total_credits = parseFloat(document.getElementById("credit-display").innerText);
  const foreign_lang_cert = document.getElementById("foreign_lang_cert").checked;
  const info_cert = document.getElementById("info_cert").checked;
  const checked = document.querySelectorAll('input[type="checkbox"][data-credit]:checked');
  const courses = Array.from(checked).map(c => c.value);

  try {
    const res = await fetch("/check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ major, total_credits, courses, foreign_lang_cert, info_cert, selected_track: selectedTrack })
    });
    const data = await res.json();
    renderResult(data);
  } catch (error) {
    console.error(error);
    alert("오류 발생");
  }
}

function renderResult(data) {
  document.getElementById("result").style.display = "block";
  let html = `<div class="result-meta">`;

  const tc = data["총이수학점"];
  const tcPct = Math.min(100, Math.round((tc["현재"] / tc["필요"]) * 100));
  html += `
    <div class="meta-box">
      <div class="meta-label">총 이수학점</div>
      <div class="meta-value">${tc["현재"]} / ${tc["필요"]}</div>
      <div>${tc["충족"] ? '<span class="success">충족</span>' : `<span class="fail">미충족</span> <span style="color:var(--danger);">(${tc["부족"]}학점 부족)</span>`}</div>
      <div class="progress-bar-wrap"><div class="progress-bar" style="width:${tcPct}%"></div></div>
    </div>
  `;

  const es = data["전공선택"];
  const esPct = Math.min(100, es["필요학점"] > 0 ? Math.round((es["이수학점"] / es["필요학점"]) * 100) : 100);
  html += `
    <div class="meta-box">
      <div class="meta-label">전공선택 학점</div>
      <div class="meta-value">${es["이수학점"]} / ${es["필요학점"]}</div>
      <div>${es["충족"] ? '<span class="success">충족</span>' : `<span class="fail">미충족</span> <span style="color:var(--danger);">(${es["부족"]}학점 부족)</span>`}</div>
      <div class="progress-bar-wrap"><div class="progress-bar" style="width:${esPct}%"></div></div>
    </div>
  `;

  html += `
    <div class="meta-box">
      <div class="meta-label">전체 달성률</div>
      <div class="meta-value">${data["전체달성률"]}%</div>
      <div>${data["졸업가능"] ? '<span class="success">졸업 가능</span>' : '<span class="fail">추가 이수 필요</span>'}</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" style="width:${data["전체달성률"]}%"></div>
      </div>
    </div>
  `;
  html += `</div><div class="result-grid">`;

  html += `
    <div class="result-item">
      <b>전공필수</b>
      &nbsp;${data["전공필수"]["충족"] ? '<span class="success">충족</span>' : '<span class="fail">미충족</span>'}
      <br><br>이수 완료:
      <div class="tag-list">
        ${data["전공필수"]["이수완료"].length > 0
          ? data["전공필수"]["이수완료"].map(c => `<span class="tag done">✓ ${c}</span>`).join("")
          : '<span style="color:var(--muted)">없음</span>'}
      </div>
      <br>미이수:
      <div class="tag-list">
        ${data["전공필수"]["미이수"].length > 0
          ? data["전공필수"]["미이수"].map(c => `<span class="tag missing">✗ ${c}</span>`).join("")
          : '<span style="color:var(--muted)">없음</span>'}
      </div>
    </div>
  `;

  html += `
    <div class="result-item">
      <b>교양기초</b>
      &nbsp;${data["교양기초"]["충족"] ? '<span class="success">충족</span>' : '<span class="fail">미충족</span>'}
      <br><br>미이수:
      <div class="tag-list">
        ${data["교양기초"]["미이수"].length > 0
          ? data["교양기초"]["미이수"].map(c => `<span class="tag missing">✗ ${c}</span>`).join("")
          : '<span style="color:var(--muted)">없음</span>'}
      </div>
    </div>
  `;

  html += `
    <div class="result-item">
      <b>전공선택</b>
      &nbsp;${es["충족"] ? '<span class="success">충족</span>' : '<span class="fail">미충족</span>'}
      <br>${es["이수학점"]} / ${es["필요학점"]} 학점
      ${!es["충족"] ? `&nbsp;<span style="color:var(--danger);">(${es["부족"]}학점 부족)</span>` : ""}
      <div class="progress-bar-wrap"><div class="progress-bar" style="width:${esPct}%"></div></div>
    </div>
  `;

  if (data["트랙"]) {
    const t = data["트랙"];
    html += `
      <div class="result-item track-item">
        <b>트랙: ${t["선택트랙"]}</b>
        &nbsp;${t["충족"] ? '<span class="success">충족</span>' : '<span class="fail">미충족</span>'}
        <br><span style="font-size:13px; color:var(--muted);">${t["설명"]}</span>
        <br><br><b>트랙 필수</b>
        &nbsp;${t["트랙필수"]["충족"] ? '<span class="success">충족</span>' : '<span class="fail">미충족</span>'}
        <br>미이수:
        <div class="tag-list">
          ${t["트랙필수"]["미이수"].length > 0
            ? t["트랙필수"]["미이수"].map(c => `<span class="tag missing">✗ ${c}</span>`).join("")
            : '<span style="color:var(--muted)">없음</span>'}
        </div>
        <br><b>트랙 총 이수학점</b>: ${t["총이수학점"]} / ${t["필요최소학점"]} 학점
        <div class="progress-bar-wrap">
          <div class="progress-bar" style="width:${Math.min(100, Math.round((t["총이수학점"] / t["필요최소학점"]) * 100))}%"></div>
        </div>
      </div>
    `;
  }

  html += `
    <div class="result-item cert-item">
      <b>졸업인증</b>
      &nbsp;${data["졸업인증"]["충족"] ? '<span class="success">충족</span>' : '<span class="fail">미충족</span>'}
      <br><br>
      외국어인증: ${data["졸업인증"]["외국어인증"]["충족"] ? '<span class="success">✓</span>' : '<span class="fail">✗</span>'}
      &nbsp;&nbsp;
      정보/산업실무역량인증: ${data["졸업인증"]["정보/산업실무역량인증"]["충족"] ? '<span class="success">✓</span>' : '<span class="fail">✗</span>'}
    </div>
  `;

  html += `
    <div class="result-item overall-item">
      <b>전체 달성률</b>: ${data["전체달성률"]}%
      <div class="progress-bar-wrap">
        <div class="progress-bar" style="width:${data["전체달성률"]}%"></div>
      </div>
    </div>
  `;

  html += `
    <div class="final-result ${data["졸업가능"] ? "pass" : "not-pass"}">
      ${data["졸업가능"] ? "🎉 졸업 가능합니다!" : "⚠️ 아직 부족한 요건이 있습니다."}
    </div>
  `;
  html += `</div>`;

  document.getElementById("result-content").innerHTML = html;
  revealSection(document.getElementById("result"));
}
</script>

</body>
</html>
