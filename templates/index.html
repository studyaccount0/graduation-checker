<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>연세대 미래캠퍼스 졸업요건 체커</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', sans-serif;
      background: #f3f6ff;
      padding: 40px 20px;
      color: #222;
    }

    .container { max-width: 900px; margin: auto; }

    .card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 { text-align: center; margin-bottom: 10px; color: #003366; }

    .subtitle { text-align: center; color: #666; margin-bottom: 30px; }

    label { display: block; margin-bottom: 8px; font-weight: bold; }

    .course-section { margin-bottom: 28px; }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #003366;
    }

    .course-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }

    .course-item {
      background: #f7f9ff;
      border: 1px solid #dde3f0;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .course-item.track-required {
      background: #fff8e1;
      border-color: #f9a825;
    }

    .course-item input { width: 18px; height: 18px; }

    .checkbox-group {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #003366;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover { opacity: 0.9; }

    #result { display: none; }

    .result-item { padding: 14px 0; border-bottom: 1px solid #eee; }

    .success { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }

    .final-result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .pass { background: #e6f4ea; color: #1a7a3a; }
    .not-pass { background: #fdecea; color: #c0392b; }

    select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #dde3f0;
      border-radius: 10px;
      background: #fafbff;
      font-size: 15px;
      margin-bottom: 20px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus { border-color: #003366; }

    .credit-box {
      background: #f7f9ff;
      border: 1px solid #dde3f0;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      margin-bottom: 24px;
      font-weight: bold;
    }

    #credit-display {
      font-size: 28px;
      color: #003366;
      margin-top: 8px;
    }

    #track-section {
      display: none;
      margin-bottom: 28px;
      border: 2px solid #e8edf8;
      border-radius: 14px;
      padding: 20px;
      background: #f7f9ff;
    }

    #track-section .section-title { margin-bottom: 6px; }

    .track-desc { font-size: 13px; color: #666; margin-bottom: 14px; font-weight: normal; }

    .track-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }

    .track-tab {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1.5px solid #003366;
      background: white;
      color: #003366;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .track-tab:hover { background: #e8edf8; }
    .track-tab.active { background: #003366; color: white; }
    .track-tab.none-tab { border-color: #aaa; color: #888; }
    .track-tab.none-tab.active { background: #888; color: white; border-color: #888; }

    .track-courses-wrap { display: none; }
    .track-courses-wrap.visible { display: block; }

    .progress-bar-wrap {
      background: #e0e7ff;
      border-radius: 8px;
      height: 10px;
      margin-top: 6px;
      overflow: hidden;
    }

    .progress-bar {
      height: 10px;
      background: #003366;
      border-radius: 8px;
      transition: width 0.4s;
    }

    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

    .tag { background: #e8edf8; color: #003366; border-radius: 8px; padding: 3px 10px; font-size: 13px; }
    .tag.done { background: #e6f4ea; color: #1a7a3a; }
    .tag.missing { background: #fdecea; color: #c0392b; }

    /* 트랙 추천 */
    .rec-card {
      border: 2px solid #e0e7ff;
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }

    .rec-card.rank-1 { border-color: #f9a825; background: #fffde7; }
    .rec-card.rank-2 { border-color: #90caf9; background: #e3f2fd; }
    .rec-card.rank-3 { border-color: #a5d6a7; background: #f1f8e9; }

    .rec-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .rec-title { font-size: 17px; font-weight: bold; color: #003366; }
    .rec-pct { font-size: 22px; font-weight: bold; color: #003366; }
    .rec-desc { font-size: 13px; color: #666; margin-bottom: 12px; }

    .rank-badge {
      display: inline-block;
      font-size: 13px;
      font-weight: bold;
      border-radius: 20px;
      padding: 3px 12px;
      margin-right: 8px;
    }

    .rank-1 .rank-badge { background: #f9a825; color: white; }
    .rank-2 .rank-badge { background: #90caf9; color: #003366; }
    .rank-3 .rank-badge { background: #a5d6a7; color: #1a5c2a; }

    .rec-stat { font-size: 13px; color: #444; margin-bottom: 10px; }

    /* 최단 루트 */
    .route-summary { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }

    .route-stat-box {
      flex: 1;
      min-width: 120px;
      background: #f3f0ff;
      border: 2px solid #c4b5fd;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .route-stat-box .num { font-size: 28px; font-weight: bold; color: #6a3093; }
    .route-stat-box .label { font-size: 13px; color: #666; margin-top: 4px; }

    .route-group { margin-bottom: 20px; }

    .route-group-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 10px;
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-block;
    }

    .route-group-title.type-전공필수    { background: #dbeafe; color: #1e40af; }
    .route-group-title.type-교양기초필수 { background: #dcfce7; color: #166534; }
    .route-group-title.type-트랙필수    { background: #fef9c3; color: #854d0e; }
    .route-group-title.type-트랙선택    { background: #fce7f3; color: #9d174d; }

    .route-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fafbff;
      border: 1px solid #e0e7ff;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }

    .route-item .name { font-weight: bold; font-size: 14px; }
    .route-item .credit { font-size: 13px; color: #6a3093; font-weight: bold; white-space: nowrap; }
    .route-item .note { font-size: 11px; color: #999; margin-top: 2px; }

    .all-done-msg {
      text-align: center;
      padding: 30px;
      color: #1a7a3a;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>
<div class="container">

  <div class="card">
    <h1>🎓 연세대 미래캠퍼스 졸업요건 체커</h1>
    <div class="subtitle">전공을 선택하고 이수한 과목을 체크하세요</div>

    <label for="major">전공 선택</label>
    <select id="major">
      {% for major in majors %}
      <option value="{{ major }}">{{ major }}</option>
      {% endfor %}
    </select>

    <div id="track-section">
      <div class="section-title">🛤️ 트랙 선택</div>
      <div class="track-desc">트랙을 선택하면 해당 트랙의 이수 요건도 함께 검사합니다.</div>
      <div class="track-tabs" id="track-tabs"></div>
      <div id="track-courses-area"></div>
    </div>

    <div class="credit-box">
      현재 선택 학점
      <div id="credit-display">0</div>
    </div>

    <div class="course-section">
      <div class="section-title">📘 전공필수 과목</div>
      <div id="major-course-list" class="course-list"></div>
    </div>

    <div class="course-section">
      <div class="section-title">📗 교양기초 과목</div>
      <div id="lib-course-list" class="course-list"></div>
    </div>

    <div class="course-section">
      <div class="section-title">📙 전공선택 과목</div>
      <div id="elective-course-list" class="course-list"></div>
    </div>

    <label>졸업인증</label>
    <div class="checkbox-group">
      <label>
        <input type="checkbox" id="foreign_lang_cert"> 외국어인증
      </label>
      <label>
        <input type="checkbox" id="info_cert"> 정보/산업실무역량인증
      </label>
    </div>

    <button class="btn" onclick="checkGraduation()">졸업요건 확인하기</button>

    <div id="recommend-btn-wrap" style="display:none; margin-top:12px;">
      <button class="btn" style="background:#1a6b3a;" onclick="recommendTrack()">
        🔍 내 이수 과목으로 트랙 추천받기
      </button>
    </div>

    <div style="margin-top:12px;">
      <button class="btn" style="background:#6a3093;" onclick="showMinRoute()">
        🗺️ 졸업 최단 루트 보기
      </button>
    </div>

  </div>

  <div class="card" id="result">
    <h2 style="margin-bottom:20px;">📊 결과</h2>
    <div id="result-content"></div>
  </div>

  <div class="card" id="recommend-result" style="display:none;">
    <h2 style="margin-bottom:6px;">🎯 트랙 추천 결과</h2>
    <div style="color:#666; font-size:13px; margin-bottom:20px;">이수 과목 기준 달성률이 높은 순으로 정렬됩니다.</div>
    <div id="recommend-content"></div>
  </div>

  <div class="card" id="route-result" style="display:none;">
    <h2 style="margin-bottom:6px;">🗺️ 졸업 최단 루트</h2>
    <div style="color:#666; font-size:13px; margin-bottom:20px;">
      현재 이수 과목 기준, 졸업을 위해 반드시 들어야 할 최소 과목 목록입니다.
    </div>
    <div id="route-content"></div>
  </div>

</div>

<script>
let allTracks = {};
let selectedTrack = null;

document.getElementById("major").addEventListener("change", loadCourses);
window.onload = loadCourses;


async function loadCourses() {
  const major = document.getElementById("major").value;
  const res = await fetch(`/courses/${major}`);
  const courses = await res.json();

  document.getElementById("major-course-list").innerHTML = "";
  document.getElementById("lib-course-list").innerHTML = "";
  document.getElementById("elective-course-list").innerHTML = "";

  courses.major_required.forEach(course => {
    document.getElementById("major-course-list").innerHTML += courseItemHTML(course);
  });

  courses.liberal_required.forEach(course => {
    document.getElementById("lib-course-list").innerHTML += courseItemHTML(course);
  });

  (courses.major_electives || []).forEach(course => {
    document.getElementById("elective-course-list").innerHTML += courseItemHTML(course);
  });

  allTracks = courses.tracks || {};
  selectedTrack = null;
  renderTrackSection(allTracks);
  updateCredits();
}


function courseItemHTML(course, extraClass = "") {
  return `
    <label class="course-item ${extraClass}">
      <input type="checkbox"
             value="${course.name}"
             data-credit="${course.credit}"
             onchange="updateCredits()">
      ${course.name} (${course.credit}학점)
    </label>
  `;
}


function renderTrackSection(tracks) {
  const section = document.getElementById("track-section");
  const tabsEl = document.getElementById("track-tabs");
  const areaEl = document.getElementById("track-courses-area");
  const recBtn = document.getElementById("recommend-btn-wrap");

  if (Object.keys(tracks).length === 0) {
    section.style.display = "none";
    recBtn.style.display = "none";
    return;
  }

  section.style.display = "block";
  recBtn.style.display = "block";

  let tabHTML = `<button class="track-tab none-tab active" onclick="selectTrack(null, this)">선택 안 함</button>`;
  Object.keys(tracks).forEach(name => {
    tabHTML += `<button class="track-tab" onclick="selectTrack('${name}', this)">${name}</button>`;
  });
  tabsEl.innerHTML = tabHTML;

  areaEl.innerHTML = "";
  Object.entries(tracks).forEach(([name, data]) => {
    areaEl.innerHTML += `
      <div id="track-wrap-${name}" class="track-courses-wrap">
        <div style="margin-bottom:10px; font-size:13px; color:#555;">${data.설명}</div>
        <div style="margin-bottom:8px; font-weight:bold; color:#003366;">
          🔒 트랙 필수 (${data.필수학점}학점 이수 필요)
        </div>
        <div class="course-list" style="margin-bottom:14px;">
          ${data.트랙필수.map(c => courseItemHTML(c, "track-required")).join("")}
        </div>
        <div style="margin-bottom:8px; font-weight:bold; color:#003366;">📂 트랙 선택</div>
        <div class="course-list">
          ${data.트랙선택.map(c => courseItemHTML(c)).join("")}
        </div>
        <div style="margin-top:10px; font-size:13px; color:#888;">
          * 트랙 이수: 트랙 필수 ${data.필수학점}학점 포함 총 ${data.최소이수학점}학점 이상 이수
        </div>
      </div>
    `;
  });
}


function selectTrack(trackName, btn) {
  document.querySelectorAll(".track-tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  document.querySelectorAll(".track-courses-wrap").forEach(el => el.classList.remove("visible"));
  selectedTrack = trackName;
  if (trackName) {
    const wrap = document.getElementById(`track-wrap-${trackName}`);
    if (wrap) wrap.classList.add("visible");
  }
  updateCredits();
}


function updateCredits() {
  let total = 0;
  document.querySelectorAll('input[type="checkbox"][data-credit]:checked').forEach(c => {
    total += parseFloat(c.dataset.credit);
  });
  document.getElementById("credit-display").innerText = total;
}


async function showMinRoute() {
  const major = document.getElementById("major").value;
  const checked = document.querySelectorAll('input[type="checkbox"][data-credit]:checked');
  const courses = Array.from(checked).map(c => c.value);

  try {
    const res = await fetch("/min-route", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ major, courses, selected_track: selectedTrack })
    });
    const data = await res.json();
    renderRoute(data);
  } catch (e) {
    console.error(e);
    alert("오류 발생");
  }
}


function renderRoute(data) {
  const el = document.getElementById("route-result");
  const content = document.getElementById("route-content");
  el.style.display = "block";

  if (data.error) {
    content.innerHTML = `<div style="color:red;">${data.error}</div>`;
    el.scrollIntoView({ behavior: "smooth" });
    return;
  }

  if (data.총과목수 === 0) {
    content.innerHTML = `
      <div class="all-done-msg">
        🎉 필수 이수 과목을 모두 완료했습니다!<br>
        <span style="font-size:14px; color:#666; font-weight:normal;">졸업요건 확인하기로 최종 확인해 보세요.</span>
      </div>`;
    el.scrollIntoView({ behavior: "smooth" });
    return;
  }

  let html = `
    <div class="route-summary">
      <div class="route-stat-box">
        <div class="num">${data.총과목수}</div>
        <div class="label">남은 필수 과목</div>
      </div>
      <div class="route-stat-box">
        <div class="num">${data.총학점}</div>
        <div class="label">남은 학점</div>
      </div>
      ${data.선택트랙 ? `
      <div class="route-stat-box">
        <div class="num" style="font-size:16px;">${data.선택트랙}</div>
        <div class="label">선택 트랙</div>
      </div>` : ""}
    </div>
  `;

  const grouped = data.grouped;
  const groupOrder = ["전공필수", "교양기초필수", ...Object.keys(grouped).filter(k => k.startsWith("트랙"))];

  groupOrder.forEach(group => {
    if (!grouped[group]) return;
    const items = grouped[group];

    let cls = "type-전공필수";
    if (group === "교양기초필수") cls = "type-교양기초필수";
    else if (group.startsWith("트랙필수")) cls = "type-트랙필수";
    else if (group.startsWith("트랙선택")) cls = "type-트랙선택";

    const groupCredits = items.reduce((s, r) => s + r["학점"], 0);

    html += `
      <div class="route-group">
        <div class="route-group-title ${cls}">
          ${group} &nbsp;<span style="font-weight:normal; font-size:12px;">(${items.length}과목 · ${groupCredits}학점)</span>
        </div>
        ${items.map(r => `
          <div class="route-item">
            <div>
              <div class="name">${r["과목명"]}</div>
              ${r["비고"] ? `<div class="note">※ ${r["비고"]}</div>` : ""}
            </div>
            <div class="credit">${r["학점"]}학점</div>
          </div>
        `).join("")}
      </div>
    `;
  });

  content.innerHTML = html;
  el.scrollIntoView({ behavior: "smooth" });
}


async function recommendTrack() {
  const major = document.getElementById("major").value;
  const checked = document.querySelectorAll('input[type="checkbox"][data-credit]:checked');
  const courses = Array.from(checked).map(c => c.value);

  try {
    const res = await fetch("/recommend", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ major, courses })
    });
    const data = await res.json();
    renderRecommend(data);
  } catch (e) {
    console.error(e);
    alert("오류 발생");
  }
}


function renderRecommend(data) {
  const el = document.getElementById("recommend-result");
  const content = document.getElementById("recommend-content");
  el.style.display = "block";

  if (data.message) {
    content.innerHTML = `<div style="color:#888;">${data.message}</div>`;
    el.scrollIntoView({ behavior: "smooth" });
    return;
  }

  const rankLabel = ["🥇 1위", "🥈 2위", "🥉 3위"];
  const rankClass = ["rank-1", "rank-2", "rank-3"];

  let html = "";

  data.tracks.forEach((t, i) => {
    const rank = i < 3 ? rankClass[i] : "";
    const label = i < 3 ? rankLabel[i] : `${i+1}위`;
    const pct = t["달성률"];
    const barColor = t["이수완료"] ? "#1a7a3a" : (pct >= 60 ? "#003366" : "#aaa");

    html += `
      <div class="rec-card ${rank}">
        <div class="rec-header">
          <div class="rec-title">
            <span class="rank-badge">${label}</span>${t["트랙명"]}
            ${t["이수완료"] ? '<span class="tag done" style="font-size:12px; padding:2px 8px;">✓ 이수 가능</span>' : ""}
          </div>
          <div class="rec-pct">${pct}%</div>
        </div>
        <div class="rec-desc">${t["설명"]}</div>
        <div class="progress-bar-wrap" style="margin-bottom:10px;">
          <div class="progress-bar" style="width:${pct}%; background:${barColor};"></div>
        </div>
        <div class="rec-stat">
          이수 학점: <b>${t["이수학점"]}</b> / ${t["필요학점"]}학점
          &nbsp;|&nbsp; 잔여: <b>${t["잔여학점"]}학점</b>
        </div>
        <div style="margin-bottom:6px; font-size:13px; font-weight:bold;">🔒 트랙 필수</div>
        <div class="tag-list" style="margin-bottom:10px;">
          ${t["트랙필수_완료"].map(c => `<span class="tag done">✓ ${c}</span>`).join("")}
          ${t["트랙필수_미이수"].map(c => `<span class="tag missing">✗ ${c}</span>`).join("")}
          ${t["트랙필수_완료"].length === 0 && t["트랙필수_미이수"].length === 0
            ? '<span style="color:#aaa; font-size:13px;">없음</span>' : ""}
        </div>
        ${t["트랙선택_미이수"].length > 0 ? `
        <div style="margin-bottom:6px; font-size:13px; font-weight:bold;">📂 추가 이수 가능한 트랙 선택 과목</div>
        <div class="tag-list">
          ${t["트랙선택_완료"].map(c => `<span class="tag done">✓ ${c}</span>`).join("")}
          ${t["트랙선택_미이수"].map(c => `<span class="tag" style="background:#f0f0f0; color:#555;">○ ${c}</span>`).join("")}
        </div>` : `
        <div style="font-size:13px; color:#1a7a3a; font-weight:bold;">✅ 트랙 선택 과목 모두 이수 완료</div>`}
      </div>
    `;
  });

  content.innerHTML = html;
  el.scrollIntoView({ behavior: "smooth" });
}


async function checkGraduation() {
  const major = document.getElementById("major").value;
  const total_credits = parseFloat(document.getElementById("credit-display").innerText);
  const foreign_lang_cert = document.getElementById("foreign_lang_cert").checked;
  const info_cert = document.getElementById("info_cert").checked;
  const checked = document.querySelectorAll('input[type="checkbox"][data-credit]:checked');
  const courses = Array.from(checked).map(c => c.value);

  try {
    const res = await fetch("/check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ major, total_credits, courses, foreign_lang_cert, info_cert, selected_track: selectedTrack })
    });
    const data = await res.json();
    renderResult(data);
  } catch (error) {
    console.error(error);
    alert("오류 발생");
  }
}


function renderResult(data) {
  document.getElementById("result").style.display = "block";
  let html = "";

  const tc = data["총이수학점"];
  const tcPct = Math.min(100, Math.round((tc["현재"] / tc["필요"]) * 100));
  html += `
    <div class="result-item">
      <b>총 이수학점</b>
      &nbsp;${tc["충족"] ? '<span class="success">충족</span>' : '<span class="fail">미충족</span>'}
      <br>${tc["현재"]} / ${tc["필요"]} 학점
      ${!tc["충족"] ? `&nbsp;<span style="color:#c0392b;">(${tc["부족"]}학점 부족)</span>` : ""}
      <div class="progress-bar-wrap"><div class="progress-bar" style="width:${tcPct}%"></div></div>
    </div>
  `;

  html += `
    <div class="result-item">
      <b>전공필수</b>
      &nbsp;${data["전공필수"]["충족"] ? '<span class="success">충족</span>' : '<span class="fail">미충족</span>'}
      <br><br>
      이수 완료:
      <div class="tag-list">
        ${data["전공필수"]["이수완료"].length > 0
          ? data["전공필수"]["이수완료"].map(c => `<span class="tag done">✓ ${c}</span>`).join("")
          : '<span style="color:#aaa">없음</span>'}
      </div>
      <br>미이수:
      <div class="tag-list">
        ${data["전공필수"]["미이수"].length > 0
          ? data["전공필수"]["미이수"].map(c => `<span class="tag missing">✗ ${c}</span>`).join("")
          : '<span style="color:#aaa">없음</span>'}
      </div>
    </div>
  `;

  html += `
    <div class="result-item">
      <b>교양기초</b>
      &nbsp;${data["교양기초"]["충족"] ? '<span class="success">충족</span>' : '<span class="fail">미충족</span>'}
      <br><br>미이수:
      <div class="tag-list">
        ${data["교양기초"]["미이수"].length > 0
          ? data["교양기초"]["미이수"].map(c => `<span class="tag missing">✗ ${c}</span>`).join("")
          : '<span style="color:#aaa">없음</span>'}
      </div>
    </div>
  `;

  const es = data["전공선택"];
  const esPct = Math.min(100, es["필요학점"] > 0 ? Math.round((es["이수학점"] / es["필요학점"]) * 100) : 100);
  html += `
    <div class="result-item">
      <b>전공선택</b>
      &nbsp;${es["충족"] ? '<span class="success">충족</span>' : '<span class="fail">미충족</span>'}
      <br>${es["이수학점"]} / ${es["필요학점"]} 학점
      ${!es["충족"] ? `&nbsp;<span style="color:#c0392b;">(${es["부족"]}학점 부족)</span>` : ""}
      <div class="progress-bar-wrap"><div class="progress-bar" style="width:${esPct}%"></div></div>
    </div>
  `;

  if (data["트랙"]) {
    const t = data["트랙"];
    html += `
      <div class="result-item">
        <b>트랙: ${t["선택트랙"]}</b>
        &nbsp;${t["충족"] ? '<span class="success">충족</span>' : '<span class="fail">미충족</span>'}
        <br><span style="font-size:13px;color:#666;">${t["설명"]}</span>
        <br><br><b>트랙 필수</b>
        &nbsp;${t["트랙필수"]["충족"] ? '<span class="success">충족</span>' : '<span class="fail">미충족</span>'}
        <br>미이수:
        <div class="tag-list">
          ${t["트랙필수"]["미이수"].length > 0
            ? t["트랙필수"]["미이수"].map(c => `<span class="tag missing">✗ ${c}</span>`).join("")
            : '<span style="color:#aaa">없음</span>'}
        </div>
        <br><b>트랙 총 이수학점</b>: ${t["총이수학점"]} / ${t["필요최소학점"]} 학점
        <div class="progress-bar-wrap">
          <div class="progress-bar" style="width:${Math.min(100, Math.round((t["총이수학점"] / t["필요최소학점"]) * 100))}%"></div>
        </div>
      </div>
    `;
  }

  html += `
    <div class="result-item">
      <b>졸업인증</b>
      &nbsp;${data["졸업인증"]["충족"] ? '<span class="success">충족</span>' : '<span class="fail">미충족</span>'}
      <br><br>
      외국어인증: ${data["졸업인증"]["외국어인증"]["충족"] ? '<span class="success">✓</span>' : '<span class="fail">✗</span>'}
      &nbsp;&nbsp;
      정보/산업실무역량인증: ${data["졸업인증"]["정보/산업실무역량인증"]["충족"] ? '<span class="success">✓</span>' : '<span class="fail">✗</span>'}
    </div>
  `;

  html += `
    <div class="result-item">
      <b>전체 달성률</b>: ${data["전체달성률"]}%
      <div class="progress-bar-wrap">
        <div class="progress-bar" style="width:${data["전체달성률"]}%"></div>
      </div>
    </div>
  `;

  html += `
    <div class="final-result ${data["졸업가능"] ? "pass" : "not-pass"}">
      ${data["졸업가능"] ? "🎉 졸업 가능합니다!" : "⚠️ 아직 부족한 요건이 있습니다."}
    </div>
  `;

  document.getElementById("result-content").innerHTML = html;
  document.getElementById("result").scrollIntoView({ behavior: "smooth" });
}
</script>
